<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asynchronous JavaScript & RESTful APIs: Weather Dashboard</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --error-bg: rgba(239, 68, 68, 0.2);
            --error-border: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            letter-spacing: 0.5px;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }

        /* Search Bar Components */
        .search-form {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .search-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .search-input::placeholder {
            color: #64748b;
        }

        .search-btn {
            background: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .search-btn:hover {
            opacity: 0.9;
        }

        /* Error Notice Interface */
        .error-display {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }

        /* Loading Spinner */
        .loading-spinner {
            text-align: center;
            padding: 2rem 0;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Weather UI Data Panel */
        .weather-info {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .location-meta {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .city-name {
            font-size: 1.75rem;
            margin: 0;
            font-weight: 600;
        }

        .country-code {
            color: var(--accent-color);
            font-size: 0.9rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .main-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
        }

        .temp-val {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
        }

        .condition-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            text-transform: capitalize;
            margin-top: 0.25rem;
        }

        /* Nested Grid Elements */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--card-border);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .metric-val {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>Live Weather Dashboard</h1>

        <form id="searchForm" class="search-form">
            <input type="text" id="searchInput" class="search-input" placeholder="Enter city name... (e.g., London)" required autocomplete="off">
            <button type="submit" class="search-btn">Search</button>
        </form>

        <div id="errorDisplay" class="error-display"></div>

        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner"></div>
            <p style="color: var(--text-muted); margin: 0;">Fetching live data...</p>
        </div>

        <div id="weatherInfo" class="weather-info">
            <div class="location-meta">
                <span id="countryCode" class="country-code"></span>
                <h2 id="cityName" class="city-name"></h2>
            </div>

            <div class="main-display">
                <h3 id="tempVal" class="temp-val">--°C</h3>
                <div id="conditionDesc" class="condition-desc">--</div>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-label">Humidity</div>
                    <p id="humidityVal" class="metric-val">--%</p>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Wind Speed</div>
                    <p id="windVal" class="metric-val">-- m/s</p>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Latitude</div>
                    <p id="latVal" class="metric-val">--</p>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Longitude</div>
                    <p id="lonVal" class="metric-val">--</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Target DOM nodes element structural mapping matrices
            const searchForm = document.getElementById('searchForm');
            const searchInput = document.getElementById('searchInput');
            const errorDisplay = document.getElementById('errorDisplay');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const weatherInfo = document.getElementById('weatherInfo');

            // API endpoint references (Geocoding API + Weather Interpretation engine setup)
            const GEO_API_URL = "https://geocoding-api.open-meteo.com/v1/search";
            const WEATHER_API_URL = "https://api.open-meteo.com/v1/forecast";

            // Weather code dictionary mapper array to parse Open-Meteo integers safely to descriptions
            const weatherCodes = {
                0: "Clear Sky",
                1: "Mainly Clear", 2: "Partly Cloudy", 3: "Overcast",
                45: "Fog", 48: "Depositing Rime Fog",
                51: "Light Drizzle", 53: "Moderate Drizzle", 55: "Dense Drizzle",
                61: "Slight Rain", 63: "Moderate Rain", 65: "Heavy Rain",
                71: "Slight Snow Fall", 73: "Moderate Snow Fall", 75: "Heavy Snow Fall",
                95: "Thunderstorm"
            };

            // Main Orchestration Layer processing async request actions
            async function fetchWeatherData(cityNameQuery) {
                // Reset UI layouts visual display parameters
                hideError();
                weatherInfo.style.display = 'none';
                loadingSpinner.style.display = 'block';

                try {
                    // Step 1: Forward search requests inside Geocoding lookup engine endpoints
                    const geoResponse = await fetch(`${GEO_API_URL}?name=${encodeURIComponent(cityNameQuery)}&count=1&language=en&format=json`);
                    
                    if (!geoResponse.ok) {
                        throw new Error("Network issues encountered locating network resources.");
                    }

                    const geoData = await geoResponse.json();

                    // Edge validation conditional routine: check if object returned arrays contain matches
                    if (!geoData.results || geoData.results.length === 0) {
                        throw new Error(`Could not find city matching name: "${cityNameQuery}". Please try again.`);
                    }

                    // Extract properties safely from nested parsed coordinate response objects
                    const { latitude, longitude, name, country_code } = geoData.results[0];

                    // Step 2: Fetch corresponding live weather metrics using retrieved coordinates
                    const weatherResponse = await fetch(`${WEATHER_API_URL}?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`);
                    
                    if (!weatherResponse.ok) {
                        throw new Error("Failed to load meteorological metrics from weather service.");
                    }

                    const weatherData = await weatherResponse.json();

                    // Step 3: Parse and dynamically render data directly to UI nodes layout matrices
                    updateDashboardUI({
                        cityName: name,
                        country: country_code,
                        temp: weatherData.current.temperature_2m,
                        humidity: weatherData.current.relative_humidity_2m,
                        windSpeed: weatherData.current.wind_speed_10m,
                        code: weatherData.current.weather_code,
                        lat: latitude,
                        lon: longitude
                    });

                } catch (error) {
                    showError(error.message);
                } finally {
                    loadingSpinner.style.display = 'none';
                }
            }

            // UI Rendering Utility Module
            function updateDashboardUI(data) {
                document.getElementById('cityName').textContent = data.cityName;
                document.getElementById('countryCode').textContent = data.country;
                document.getElementById('tempVal').textContent = `${Math.round(data.temp)}°C`;
                document.getElementById('humidityVal').textContent = `${data.humidity}%`;
                document.getElementById('windVal').textContent = `${data.windSpeed} m/s`;
                document.getElementById('latVal').textContent = Number(data.lat).toFixed(2);
                document.getElementById('lonVal').textContent = Number(data.lon).toFixed(2);

                // Map description string based on conditions mapping indices keys values records
                const description = weatherCodes[data.code] || "Unspecified Conditions";
                document.getElementById('conditionDesc').textContent = description;

                // Make populated weather data grid completely visible
                weatherInfo.style.display = 'block';
            }

            // Error Management helpers
            function showError(message) {
                errorDisplay.textContent = message;
                errorDisplay.style.display = 'block';
            }

            function hideError() {
                errorDisplay.textContent = '';
                errorDisplay.style.display = 'none';
            }

            // Event Listeners setup
            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const targetQuery = searchInput.value.trim();
                if (targetQuery) {
                    fetchWeatherData(targetQuery);
                }
            });
        });
    </script>
</body>
</html>
